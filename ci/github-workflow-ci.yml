name: CI

# The August 2026 re-audit found that the published tree could not be imported
# at all while its README advertised "567/567 module imports, zero failures".
# The three jobs below are exactly the checks that would have caught that.

on:
  push:
    branches: [main, "audit-fixes-*"]
  pull_request:
  workflow_dispatch:

jobs:
  import-sweep:
    name: Every module imports in a fresh interpreter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Syntax scan
        run: |
          python - <<'EOF'
          import ast, os, sys
          bad = []
          for root, dirs, files in os.walk('astra_core'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      try:
                          ast.parse(open(p, encoding='utf-8', errors='replace').read())
                      except SyntaxError as e:
                          bad.append(f"{p}: {e}")
          print(f"{len(bad)} files fail to parse")
          for b in bad:
              print("  ", b)
          sys.exit(1 if bad else 0)
          EOF
      - name: Import every module
        run: |
          python - <<'EOF'
          import importlib, os, sys, warnings
          mods = []
          for dirpath, dirnames, filenames in os.walk('astra_core'):
              dirnames[:] = [d for d in dirnames if d != '__pycache__']
              for f in filenames:
                  if f.endswith('.py'):
                      m = os.path.join(dirpath, f)[:-3].replace(os.sep, '.')
                      mods.append(m[:-9] if m.endswith('.__init__') else m)
          fail = []
          for m in sorted(set(mods)):
              try:
                  with warnings.catch_warnings():
                      warnings.simplefilter("ignore")
                      importlib.import_module(m)
              except BaseException as e:
                  fail.append((m, type(e).__name__, str(e)[:200]))
          print(f"{len(set(mods)) - len(fail)}/{len(set(mods))} modules import")
          for m, t, e in fail:
              print(f"  FAIL {m}: {t}: {e}")
          sys.exit(1 if fail else 0)
          EOF
      - name: Undefined-name budget must not grow
        run: |
          pip install pyflakes
          # `undefined name` is the failure mode that broke the published tree
          # (np.ndarray in a signature with numpy imported inside the body).
          # 14 remain, all in truncated legacy/systems/v92 and v93 modules whose
          # missing classes exist nowhere; they are marked `# AUDIT-FLAG` in
          # source rather than stubbed. This gate stops the count growing.
          N=$(python -m pyflakes astra_core | grep -c "undefined name" || true)
          echo "undefined names: $N (budget 14)"
          test "$N" -le 14

  tests:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: pytest
        run: PYTHONPATH=. python -m pytest astra_core/tests -q
      - name: Comprehensive system test (must exit non-zero on failure)
        run: PYTHONPATH=. python astra_core/comprehensive_system_test.py
      - name: Declared print-based suites
        run: |
          set -e
          for s in tests/test_specialist_capabilities.py \
                   tests/test_phase_2_4.py \
                   tests/test_installation.py \
                   tests/test_comprehensive_integration.py \
                   tests/test_v47_causal_discovery.py \
                   tests/test_v6_theoretical_discovery.py \
                   tests/test_revolutionary/run_tests.py; do
            echo "--- $s"
            PYTHONPATH=. python "astra_core/$s"
          done

  no-fabricated-tests:
    name: No always-true test helpers in production modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject always-true test helpers outside tests/
        run: |
          # 44 of these were embedded in shipped science modules; any pytest run
          # rooted at the repo would have collected them as guaranteed passes.
          ! grep -rn "'passed': True" --include=*.py astra_core \
            | grep -v "^astra_core/tests/"
